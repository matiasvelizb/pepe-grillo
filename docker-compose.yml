services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pepe-grillo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pepe_grillo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pepe-grillo-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FlareSolverr - solves Cloudflare challenges for the MyInstants scraper
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: pepe-grillo-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: America/Santiago
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8191/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Discord Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pepe-grillo-bot
    restart: unless-stopped
    environment:
      # Discord
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      GUILD_ID: ${GUILD_ID}

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pepe_grillo
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # FlareSolverr
      FLARESOLVERR_URL: http://flaresolverr:8191
      FLARESOLVERR_ENABLED: "true"

      # Node
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flaresolverr:
        condition: service_healthy
    volumes:
      # Mount for logs if needed
      - ./logs:/app/logs

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
