name: myinstants-discord-soundboard

services:
  # FlareSolverr - solves Cloudflare challenges for the MyInstants scraper
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-America/Santiago}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
      NODE_ENV: production
    depends_on:
      flaresolverr:
        condition: service_healthy
    volumes:
      # SQLite database + downloaded audio
      - ./data:/app/data
      # Daily activity logs (kept 7 days)
      - ./logs:/app/logs
